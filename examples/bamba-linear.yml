MODELS:
  1: &model1 tuluv3/2.3T_base/lr1e_6_wd_0_gbs_16-HF
  2: &model2 tuluv3/2.3T_base/lr1e_6_wd_0_gbs_128_base-HF
  # 1: &model1 ../Bamba-9b-2.8T
  # 2: &model2 ../Bamba-9b-2.1T-finemath 
  # 1: &model1 ../Bamba-9b-2.3T-HF
  # 2: &model2 tuluv3/2.3T_base/lr1e_6_wd_0.1_gbs_16-HF

# model soup
slices:
  - sources:
      - model: *model1
        layer_range: [0, 9]
      - model: *model2
        layer_range: [0, 9]
  - sources:
      - model: *model1
        layer_range: [9, 10]
      - model: *model2
        layer_range: [9, 10]
  - sources:
      - model: *model1
        layer_range: [10, 18]
      - model: *model2
        layer_range: [10, 18]
  - sources:
      - model: *model1
        layer_range: [18, 19]
      - model: *model2
        layer_range: [18, 19]
  - sources:
      - model: *model1
        layer_range: [19, 27]
      - model: *model2
        layer_range: [19, 27]
  - sources:
      - model: *model1
        layer_range: [27, 28]
      - model: *model2 
        layer_range: [27, 28]
  - sources:
      - model: *model1
        layer_range: [28, 32]
      - model: *model2
        layer_range: [28, 32]
merge_method: linear
dtype: float16
parameters:
  weight: 1.0