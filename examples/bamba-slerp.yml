      t: 
        - filter: mamba
          value: [0, 0.3, 0.5, 0.7, 1]
        - filter: feed_forward
          value: [1, 0.5, 0.7, 0.3, 0]
        - value: 0.5
  - sources:
      - model: tuluv3/2.3T_base/lr1e_6_wd_0_gbs_16-HF
        layer_range: [27, 28]
      - model: tuluv3/2.3T_base/lr1e_6_wd_0_gbs_128_base-HF
        layer_range: [27, 28]
