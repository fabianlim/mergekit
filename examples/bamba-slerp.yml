MODELS:
  1: &model1 tuluv3/2.3T_base/lr1e_6_wd_0_gbs_16-HF
  2: &model2 tuluv3/2.3T_base/lr1e_6_wd_0_gbs_128_base-HF
  # 1: &model1 ../Bamba-9b-2.8T
  # 2: &model2 ../Bamba-9b-2.1T-finemath 
  # 1: &model1 ../Bamba-9b-2.3T-HF
  # 2: &model2 tuluv3/2.3T_base/lr1e_6_wd_0.1_gbs_16-HF

SLICES: 
  1: &mamba_slice
    parameters:
      t: 
        - filter: mamba
          value: [0, 0.3, 0.5, 0.7, 1]
        - filter: feed_forward
          value: [1, 0.5, 0.7, 0.3, 0]
        - value: 0.5
  1: &mamba_slice2
    parameters:
      t: 
        - filter: mamba
          value: [1, 0.5, 0.7, 0.3, 0]
        - filter: feed_forward
          value: [0, 0.3, 0.5, 0.7, 1]
        - value: 0.5

# slerp, where each mamba slice is gradient from 0 to 1.0
slices:
  - sources:
      - model: *model1
        layer_range: [0, 9]
      - model: *model2
        layer_range: [0, 9]
    <<: *mamba_slice
  - sources:
      - model: *model1
        layer_range: [9, 10]
      - model: *model2
        layer_range: [9, 10]
    parameters: 
      t: 0.5
  - sources:
      - model: *model1
        layer_range: [10, 18]
      - model: *model2
        layer_range: [10, 18]
    <<: *mamba_slice2
  - sources:
      - model: *model1
        layer_range: [18, 19]
      - model: *model2
        layer_range: [18, 19]
    parameters: 
      t: 0.5
  - sources:
      - model: *model1
        layer_range: [19, 27]
      - model: *model2
        layer_range: [19, 27]
    <<: *mamba_slice
  - sources:
      - model: *model1
        layer_range: [27, 28]
      - model: *model2
        layer_range: [27, 28]
    parameters: 
      t: 0.5
  - sources:
      - model: *model1
        layer_range: [28, 32]
      - model: *model2
        layer_range: [28, 32]
    <<: *mamba_slice2
merge_method: slerp
base_model: *model1
dtype: float16