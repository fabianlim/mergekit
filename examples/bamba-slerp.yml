      t: 0.5
  - sources:
      - model: tuluv3/2.3T_base/lr1e_6_wd_0_gbs_16-HF
        layer_range: [28, 32]
      - model: tuluv3/2.3T_base/lr1e_6_wd_0_gbs_128_base-HF
        layer_range: [28, 32]
    parameters:
      t: 
        - filter: mamba
          value: [1, 0.5, 0.7, 0.3, 0]
        - filter: feed_forward
          value: [0, 0.3, 0.5, 0.7, 1]
        - value: 0.5
merge_method: slerp
base_model: tuluv3/2.3T_base/lr1e_6_wd_0_gbs_16-HF
